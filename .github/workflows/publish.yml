name: Publish

# Publishes this module to the Lace registry. Lace only accepts a module
# publish from a GitHub Actions job: it verifies the job's OIDC token and
# records this repository and commit as the module's provenance.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      LACE_AUTH_URL: https://preview.lace.cloud
      LACE_API_KEY: ${{ secrets.LACE_API_KEY }}
      LACE_ORGANIZATION: alicenter
    steps:
      - name: Check out module
        uses: actions/checkout@v4
        with:
          path: module

      - name: Install lace
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          curl -fsSL https://releases.lace.cloud/install.sh | LACE_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Certify
        run: lace module validate --path module

      - name: Publish
        run: |
          lace registry register --axis module \
            --manifest module/manifest.yaml \
            --readme   module/README.md \
            --path     module
